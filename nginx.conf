server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  location = /downloads/releases/latest.json {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~ ^/downloads/releases/[^/]+/(?<download_filename>Resume-Tailor-[^/]+\.(zip|exe))$ {
    add_header Content-Disposition "attachment; filename=\"$download_filename\"" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~ ^/downloads/releases/[^/]+/(?<checksum_filename>Resume-Tailor-[^/]+(\.sha256|checksums\.txt))$ {
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition "attachment; filename=\"$checksum_filename\"" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /downloads/ {
    try_files $uri =404;
  }

  location / {
    index index.html index.htm;
    try_files $uri $uri/ /index.html?$args;
  }
}
